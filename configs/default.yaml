# Default configuration for glider-zermelo-rl. All units SI unless noted.
domain:
  size_m: 50000.0          # square domain side (50 km)
  margin_m: 3000.0         # start/goal kept this far from the edges
  min_start_goal_m: 20000.0
  max_start_goal_m: 35000.0
  goal_radius_m: 1000.0

glider:
  speed_mps: 0.3           # speed through water, constant
  dt_s: 600.0              # control step
  max_steps: 400
  max_turn_deg: 30.0       # |heading change| per step at action = +/-1
  integrator: rk2          # rk2 (midpoint) or euler
  substeps: 2              # integrator sub-steps per control step

energy:                    # ASSUMPTION: e_step = (e_hotel + e_turn*|dh|/pi) * dt   [J]
  e_hotel_w: 0.5           # constant hotel load [W]
  e_turn_w: 5.0            # extra power for a 180 deg heading change in one step [W]

fields:
  train_mix: {eddies: 0.7, jet: 0.3}   # field type probabilities for train/val/test maps
  drift_max_mps: 0.05                  # weak uniform drift magnitude (uniform in [0, max])
  eddies:
    n_min: 3
    n_max: 6
    radius_min_m: 5000.0
    radius_max_m: 12000.0
    peak_min_mps: 0.1
    peak_max_mps: 0.5
  jet:
    peak_min_mps: 0.2
    peak_max_mps: 0.5
    width_min_m: 3000.0
    width_max_m: 6000.0
    meander_amp_max_m: 6000.0
    meander_wavelength_min_m: 20000.0
    meander_wavelength_max_m: 50000.0
  double_gyre:            # held-out test field only
    peak_min_mps: 0.2
    peak_max_mps: 0.4
    eps_min: 0.1
    eps_max: 0.3
    period_s: 172800.0     # 2 days

env:
  patch_size: 5            # 5x5 current samples centred on glider
  patch_spacing_m: 2000.0
  obs_noise_std_mps: 0.0   # Gaussian noise on observed currents
  observe_current: true    # ablation switch: false -> current entries zeroed
  fixed_map_seed: null     # ablation: train on a single map
  reward:
    w_time: 1.0
    w_energy: 1.0
    k_progress: 5.0
    goal_bonus: 5.0
    fail_penalty: 5.0      # leaving domain
    timeout_penalty: 5.0

splits:                    # fixed BEFORE looking at any results
  train: [0, 9999]
  val: [10000, 10099]
  test: [100000, 100199]
  confirm: [200000, 200199]   # used once, for the exploratory `stable` variant (EVAL_PROTOCOL.md)

planner:
  grid_spacing_m: 1000.0
  lookahead_m: 2000.0      # path follower look-ahead distance
  replan_every: 36         # steps between replans for time-varying fields only (0 = plan once)

ppo:
  n_envs: 8
  total_timesteps: 2000000
  quick_timesteps: 300000
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  lr_schedule: constant    # constant | linear (decays to 0 over the run)
  target_kl: null          # PPO early-stops an update's epochs when KL > 1.5 * target_kl
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [128, 128]
  log_std_init: 0.0        # initial log std of the Gaussian policy
  torch_threads: 1

eval:
  n_bootstrap: 2000
  train_seeds: [0, 1, 2, 3, 4]
